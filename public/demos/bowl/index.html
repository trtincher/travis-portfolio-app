<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>the Bowl</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #131a16; overscroll-behavior: none; }
  body { font-family: system-ui, -apple-system, sans-serif; -webkit-user-select: none; user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #fps { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 10px; color: #5b7d6b; font-size: 11px; font-variant-numeric: tabular-nums; pointer-events: none; }
  #gear { position: fixed; top: max(8px, env(safe-area-inset-top)); right: 10px; background: #233830; color: #aecbbc; border: none; border-radius: 10px; width: 38px; height: 38px; font-size: 18px; z-index: 20; }
  #result { position: fixed; top: max(40px, calc(env(safe-area-inset-top) + 30px)); left: 0; right: 0; text-align: center; pointer-events: none; opacity: 0; transform: translateY(-8px); transition: opacity .25s, transform .25s; }
  #result.show { opacity: 1; transform: none; }
  #score { font-size: 60px; font-weight: 800; color: #f3faf6; line-height: 1; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
  #math { font-size: 14px; color: #8fb3a0; margin-top: 4px; font-weight: 600; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 6px; background: linear-gradient(transparent, rgba(8,13,10,.88) 40%); pointer-events: none; }
  #round { display: flex; justify-content: space-between; color: #cfe3d8; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #round .dim { color: #6f8f7f; font-weight: 600; }
  #hint { text-align: center; color: #557565; font-size: 11px; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #0f1613; border-top: 1px solid #26402f; border-radius: 18px 18px 0 0; padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .28s cubic-bezier(.3,.9,.3,1); max-height: 72vh; overflow-y: auto; }
  #panel.open { transform: none; }
  #panel h3 { margin: 4px 0 10px; color: #dff2e8; font-size: 15px; }
  .row { display: flex; align-items: center; gap: 10px; margin: 10px 0; color: #9fc2b0; font-size: 13px; }
  .row label { width: 82px; flex-shrink: 0; }
  .row input[type=range] { flex: 1; accent-color: #f5b90b; }
  .row .val { width: 38px; text-align: right; font-variant-numeric: tabular-nums; color: #cfe6da; }
  .seg { display: flex; gap: 6px; flex: 1; }
  .seg button, .tog { flex: 1; padding: 8px 4px; border: 1px solid #2e4739; border-radius: 9px; background: #1b2a22; color: #8aaa9a; font-size: 12.5px; font-weight: 600; }
  .seg button.sel, .tog.sel { background: #2e5741; color: #eafbf1; border-color: #477d61; }
  #reset { pointer-events: auto; align-self: center; padding: 8px 18px; border: 1px solid #2e4739; border-radius: 12px; background: #1b2a22; color: #8aaa9a; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fps"></div>
<button id="gear" aria-label="settings">⚙</button>

<div id="result">
  <div id="score"></div>
  <div id="math"></div>
</div>

<div id="bar">
  <div id="round"><span id="throwno">throw 1 of 3</span><span id="total">round 0</span><span class="dim" id="best">best 0</span></div>
  <button id="reset">new round</button>
  <div id="hint">flick up the lane · where you start is where the die starts</div>
</div>

<div id="panel">
  <h3>Feel knobs</h3>
  <div class="row"><label>die</label><div class="seg" data-seg="die"></div></div>
  <div class="row" data-range="power"><label>power ×</label><input type="range"><span class="val"></span></div>
  <div class="row" data-range="spin"><label>spin</label><input type="range"><span class="val"></span></div>
  <div class="row" data-range="gravity"><label>gravity ×</label><input type="range"><span class="val"></span></div>
  <div class="row" data-range="pinMass"><label>pin mass</label><input type="range"><span class="val"></span></div>
  <div class="row" data-range="pinBounce"><label>pin bounce</label><input type="range"><span class="val"></span></div>
  <div class="row" data-range="size"><label>die size</label><input type="range"><span class="val"></span></div>
  <div class="row">
    <label>toggles</label>
    <button class="tog" data-toggle="bumpers">bumpers</button>
    <button class="tog" data-toggle="sound">sound</button>
    <button class="tog" data-toggle="haptics">haptics</button>
    <button class="tog" data-toggle="shadows">shadows</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
  "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
} }
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
