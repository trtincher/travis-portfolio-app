<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>the Throw</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%239a6b3d'/%3E%3Ccircle cx='8' cy='8' r='2' fill='%23c4453a'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16110d; overscroll-behavior: none; }
  body { font-family: system-ui, -apple-system, sans-serif; -webkit-user-select: none; user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #gear { position: fixed; top: max(8px, env(safe-area-inset-top)); right: 10px; background: #3a2b20; color: #e2c59c; border: none; border-radius: 10px; width: 38px; height: 38px; font-size: 18px; z-index: 20; }
  #hud { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none; color: #f0dcc0; font-size: 13px; font-weight: 700; letter-spacing: .02em; }
  #hud .sub { display: block; color: #9c7f63; font-weight: 600; font-size: 12px; margin-top: 3px; }
  #score { position: fixed; left: 16px; bottom: calc(112px + env(safe-area-inset-bottom)); text-align: left; pointer-events: none;
           transform-origin: left bottom;
           font-size: 56px; font-weight: 900; color: #f7ecdb; line-height: 1; text-shadow: 0 2px 16px rgba(0,0,0,.6); }
  #score.pop { animation: pop .2s ease-out; }
  @keyframes pop { 0% { transform: scale(1.4); color: #ffcf5c; } 100% { transform: scale(1); } }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
         display: flex; flex-direction: column; gap: 6px; background: linear-gradient(transparent, rgba(14,10,7,.9) 45%); pointer-events: none; }
  #tally { display: flex; justify-content: space-between; color: #e2c59c; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #tally .dim { color: #9c7f63; font-weight: 600; }
  #hint { text-align: center; color: #8a6e55; font-size: 11.5px; }
  #over { position: fixed; inset: 0; z-index: 25; display: none; align-items: center; justify-content: center; background: rgba(14,10,7,.86); color: #f7ecdb; text-align: center; padding: 24px; }
  #over.show { display: flex; }
  #over h2 { margin: 0 0 4px; font-size: 24px; }
  #over .big { font-size: 58px; font-weight: 900; line-height: 1; margin: 6px 0; color: #ffcf5c; }
  #over p { color: #bb9a79; margin: 4px 0; font-size: 14px; }
  #over button { margin-top: 18px; padding: 14px 28px; border: none; border-radius: 14px; background: #ffcf5c; color: #2a1c05; font-size: 17px; font-weight: 800; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #17110c; border-top: 1px solid #40301f; border-radius: 18px 18px 0 0;
           padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .28s cubic-bezier(.3,.9,.3,1); max-height: 72vh; overflow-y: auto; }
  #panel.open { transform: none; }
  #panel h3 { margin: 4px 0 10px; color: #f0dcc0; font-size: 15px; }
  .row { display: flex; align-items: center; gap: 10px; margin: 10px 0; color: #bb9a79; font-size: 13px; }
  .row label { width: 84px; flex-shrink: 0; }
  .row input[type=range] { flex: 1; accent-color: #ffcf5c; }
  .row .val { width: 40px; text-align: right; font-variant-numeric: tabular-nums; color: #e9d5ba; }
  .tog { flex: 1; padding: 8px 4px; border: 1px solid #40301f; border-radius: 9px; background: #241a12; color: #a8886a; font-size: 12.5px; font-weight: 600; }
  .tog.sel { background: #5a3f22; color: #ffeccb; border-color: #8a6329; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="gear" aria-label="settings">⚙</button>

<div id="hud"><span id="roundno">target 1</span> · <span id="spinlbl">slow ↻</span><span class="sub" id="throwno">throw 1 of 10</span></div>
<div id="score">0</div>

<div id="bar">
  <div id="tally"><span id="stuck">stuck 0</span><span class="dim" id="wep">axe</span><span class="dim" id="best">best 0</span></div>
  <div id="hint">flick up to throw · stick it in the wood · hit a stuck blade and you're done</div>
</div>

<div id="over">
  <div>
    <h2 id="overTitle">Clang.</h2>
    <div class="big" id="overTotal">0</div>
    <p id="overLine"></p>
    <p id="overBest"></p>
    <button id="again">throw again</button>
  </div>
</div>

<div id="panel">
  <h3>Feel knobs</h3>
  <div class="row" data-range="speed"><label>throw speed</label><input type="range"><span class="val"></span></div>
  <div class="row" data-range="flip"><label>flip spin</label><input type="range"><span class="val"></span></div>
  <div class="row" data-range="discSpeed"><label>disc ×</label><input type="range"><span class="val"></span></div>
  <div class="row" data-range="hitArc"><label>blade arc°</label><input type="range"><span class="val"></span></div>
  <div class="row" data-range="hitStop"><label>hit-stop</label><input type="range"><span class="val"></span></div>
  <div class="row" data-range="shake"><label>shake</label><input type="range"><span class="val"></span></div>
  <div class="row">
    <label>toggles</label>
    <button class="tog" data-toggle="sound">sound</button>
    <button class="tog" data-toggle="haptics">haptics</button>
    <button class="tog" data-toggle="shadows">shadows</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
  "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
} }
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
