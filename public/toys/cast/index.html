<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>the Cast — pull back, release</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #171a21; overscroll-behavior: none; }
  body { font-family: system-ui, -apple-system, sans-serif; -webkit-user-select: none; user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #fps { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 10px; color: #6a7387; font-size: 11px; font-variant-numeric: tabular-nums; pointer-events: none; }
  #gear { position: fixed; top: max(8px, env(safe-area-inset-top)); right: 10px; background: #2a3140; color: #b9c4d8; border: none; border-radius: 10px; width: 38px; height: 38px; font-size: 18px; z-index: 20; }
  #frame { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none; color: #d6dded; font-size: 13px; font-weight: 700; letter-spacing: .02em; }
  #frame .sub { display: block; color: #7d88a0; font-weight: 600; font-size: 12px; margin-top: 2px; }
  #result { position: fixed; top: max(64px, calc(env(safe-area-inset-top) + 54px)); left: 0; right: 0; text-align: center; pointer-events: none; opacity: 0; transform: translateY(-8px) scale(.96); transition: opacity .16s, transform .16s; }
  #result.show { opacity: 1; transform: none; }
  #score { font-size: 62px; font-weight: 900; color: #f4f7ff; line-height: 1; text-shadow: 0 2px 14px rgba(0,0,0,.6); }
  #score.miss { color: #7d88a0; font-size: 40px; } #score.bull { color: #f5c451; }
  #math { font-size: 14px; color: #9aa7c0; margin-top: 4px; font-weight: 600; }

  #gauge { position: fixed; left: 0; right: 0; bottom: calc(96px + env(safe-area-inset-bottom)); text-align: center; pointer-events: none; opacity: 0; transition: opacity .1s; color: #cdd7ea; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  #gauge.show { opacity: 1; }
  #gbar { width: 150px; height: 7px; margin: 5px auto 0; border-radius: 4px; background: #2a3140; overflow: hidden; }
  #gfill { height: 100%; width: 0%; background: linear-gradient(90deg, #6fb08a, #f5c451, #e07070); }

  #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 6px; background: linear-gradient(transparent, rgba(10,13,18,.92) 45%); pointer-events: none; }
  #tally { display: flex; justify-content: space-between; color: #d6dded; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #tally .dim { color: #7d88a0; font-weight: 600; }
  #tally .over { color: #7fd39a; }
  #hint { text-align: center; color: #6a7387; font-size: 11px; }

  #over { position: fixed; inset: 0; z-index: 25; display: none; align-items: center; justify-content: center; background: rgba(10,13,18,.84); color: #eef3ff; text-align: center; padding: 24px; }
  #over.show { display: flex; }
  #over h2 { margin: 0 0 6px; font-size: 24px; }
  #over .big { font-size: 58px; font-weight: 900; line-height: 1; margin: 8px 0; }
  #over p { color: #9aa7c0; margin: 4px 0; font-size: 14px; }
  #over button { margin-top: 18px; padding: 14px 28px; border: none; border-radius: 14px; background: #f5c451; color: #241a02; font-size: 17px; font-weight: 800; }

  #panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #12151c; border-top: 1px solid #2c3444; border-radius: 18px 18px 0 0; padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .28s cubic-bezier(.3,.9,.3,1); max-height: 74vh; overflow-y: auto; }
  #panel.open { transform: none; }
  #panel h3 { margin: 4px 0 10px; color: #dfe7f5; font-size: 15px; }
  .row { display: flex; align-items: center; gap: 10px; margin: 9px 0; color: #9aa7c0; font-size: 13px; }
  .row label { width: 92px; flex-shrink: 0; }
  .row input[type=range] { flex: 1; accent-color: #f5b90b; }
  .row .val { width: 40px; text-align: right; font-variant-numeric: tabular-nums; color: #cfd9ea; }
  .tog { flex: 1; padding: 8px 4px; border: 1px solid #2e3849; border-radius: 9px; background: #1b212c; color: #8e9bb2; font-size: 12.5px; font-weight: 600; }
  .tog.sel { background: #2f4a63; color: #eaf2ff; border-color: #4c74a0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fps"></div>
<button id="gear" aria-label="settings">⚙</button>

<div id="frame"><span id="roundno">round 1</span><span class="sub" id="throwno">throw 1 of 3</span></div>

<div id="result">
  <div id="score"></div>
  <div id="math"></div>
</div>

<div id="gauge">
  <span id="gtext">45° · 0%</span>
  <div id="gbar"><div id="gfill"></div></div>
</div>

<div id="bar">
  <div id="tally"><span id="total">0</span><span class="dim" id="last"></span><span class="dim" id="best">best 0</span></div>
  <div id="hint">drag back anywhere and let go — far rings pay more</div>
</div>

<div id="over">
  <div>
    <h2 id="overTitle">Three cast</h2>
    <div class="big" id="overTotal">0</div>
    <p id="overLine"></p>
    <p id="overBest"></p>
    <button id="again">throw again</button>
  </div>
</div>

<div id="panel">
  <h3>Feel knobs</h3>
  <div class="row" data-range="power"><label>power ×</label><input type="range"><span class="val"></span></div>
  <div class="row" data-range="gravity"><label>gravity ×</label><input type="range"><span class="val"></span></div>
  <div class="row" data-range="mass"><label>spear mass</label><input type="range"><span class="val"></span></div>
  <div class="row" data-range="drag"><label>air drag</label><input type="range"><span class="val"></span></div>
  <div class="row" data-range="wobble"><label>wobble</label><input type="range"><span class="val"></span></div>
  <div class="row" data-range="pull"><label>pull length</label><input type="range"><span class="val"></span></div>
  <div class="row" data-range="hitStop"><label>hit-stop</label><input type="range"><span class="val"></span></div>
  <div class="row" data-range="shake"><label>shake</label><input type="range"><span class="val"></span></div>
  <div class="row" data-range="thunk"><label>thunk</label><input type="range"><span class="val"></span></div>
  <div class="row">
    <label>toggles</label>
    <button class="tog" data-toggle="arc">arc</button>
    <button class="tog" data-toggle="sound">sound</button>
    <button class="tog" data-toggle="haptics">haptics</button>
    <button class="tog" data-toggle="shadows">shadows</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
  "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
} }
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
