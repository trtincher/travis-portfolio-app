<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>the Table — flip the flippers</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f16; overscroll-behavior: none; }
  body { font-family: system-ui, -apple-system, sans-serif; -webkit-user-select: none; user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #fps { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 10px; color: #4a6180; font-size: 11px; font-variant-numeric: tabular-nums; pointer-events: none; z-index: 5; }
  #gear { position: fixed; top: max(8px, env(safe-area-inset-top)); right: 10px; background: #1d2b3e; color: #a8c4e0; border: none; border-radius: 10px; width: 38px; height: 38px; font-size: 18px; z-index: 20; }
  #hud { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none; z-index: 5; }
  #score { font-size: 34px; font-weight: 900; color: #f4f8ff; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  #sub { display: block; color: #7f9cbd; font-weight: 700; font-size: 12px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  #pop { position: fixed; top: 32%; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 6;
         font-size: 30px; font-weight: 900; color: #ffd24a; text-shadow: 0 2px 14px rgba(0,0,0,.7);
         opacity: 0; transform: translateY(6px) scale(.9); transition: opacity .12s, transform .12s; }
  #pop.show { opacity: 1; transform: none; }
  #hint { position: fixed; left: 0; right: 0; bottom: calc(6px + env(safe-area-inset-bottom)); text-align: center;
          color: #5d79a0; font-size: 11.5px; font-weight: 600; pointer-events: none; z-index: 5; }
  #plunge { position: fixed; right: 0; bottom: 0; width: 34%; height: 26%; z-index: 12; touch-action: none;
            display: none; align-items: flex-end; justify-content: center;
            padding-bottom: calc(26px + env(safe-area-inset-bottom));
            background: linear-gradient(to top, rgba(255,210,74,.16), transparent 70%); }
  #plunge.on { display: flex; }
  #plunge .knob { width: 74px; height: 22px; border-radius: 11px; background: #ffd24a; box-shadow: 0 0 18px rgba(255,210,74,.5); }
  #plunge .lab { position: absolute; bottom: calc(54px + env(safe-area-inset-bottom)); color: #ffd24a; font-size: 11.5px; font-weight: 800; letter-spacing: .04em; }
  #over { position: fixed; inset: 0; z-index: 25; display: none; align-items: center; justify-content: center; background: rgba(7,11,18,.86); color: #eaf2ff; text-align: center; padding: 24px; }
  #over.show { display: flex; }
  #over h2 { margin: 0 0 4px; font-size: 24px; }
  #over .big { font-size: 58px; font-weight: 900; line-height: 1; margin: 8px 0; color: #ffd24a; }
  #over p { color: #90aece; margin: 4px 0; font-size: 14px; }
  #over button { margin-top: 18px; padding: 14px 28px; border: none; border-radius: 14px; background: #ffd24a; color: #201704; font-size: 17px; font-weight: 800; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #0d131d; border-top: 1px solid #22344a; border-radius: 18px 18px 0 0; padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .28s cubic-bezier(.3,.9,.3,1); max-height: 72vh; overflow-y: auto; }
  #panel.open { transform: none; }
  #panel h3 { margin: 4px 0 10px; color: #dce9f8; font-size: 15px; }
  .row { display: flex; align-items: center; gap: 10px; margin: 10px 0; color: #9db9d6; font-size: 13px; }
  .row label { width: 84px; flex-shrink: 0; }
  .row input[type=range] { flex: 1; accent-color: #ffd24a; }
  .row .val { width: 42px; text-align: right; font-variant-numeric: tabular-nums; color: #cfe1f5; }
  .tog { flex: 1; padding: 8px 4px; border: 1px solid #2a3d55; border-radius: 9px; background: #16212f; color: #89a6c4; font-size: 12.5px; font-weight: 600; }
  .tog.sel { background: #2b4468; color: #eaf4ff; border-color: #4d76a8; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fps"></div>
<button id="gear" aria-label="settings">⚙</button>

<div id="hud">
  <div id="score">0</div>
  <span class="sub" id="sub">ball 1 of 3 · best 0</span>
</div>
<div id="pop"></div>

<div id="plunge"><span class="lab">PULL DOWN · RELEASE</span><div class="knob"></div></div>

<div id="hint">tap left / right to flip · pull the plunger to launch</div>

<div id="over">
  <div>
    <h2 id="overTitle">Table over</h2>
    <div class="big" id="overScore">0</div>
    <p id="overLine"></p>
    <button id="again">play again</button>
  </div>
</div>

<div id="panel">
  <h3>Feel knobs</h3>
  <div class="row" data-range="flipPower"><label>flip power</label><input type="range"><span class="val"></span></div>
  <div class="row" data-range="flipSpeed"><label>flip speed</label><input type="range"><span class="val"></span></div>
  <div class="row" data-range="tipBias"><label>tip bias</label><input type="range"><span class="val"></span></div>
  <div class="row" data-range="tilt"><label>tilt</label><input type="range"><span class="val"></span></div>
  <div class="row" data-range="bumper"><label>bumper pop</label><input type="range"><span class="val"></span></div>
  <div class="row" data-range="launch"><label>launch</label><input type="range"><span class="val"></span></div>
  <div class="row">
    <label>toggles</label>
    <button class="tog" data-toggle="sound">sound</button>
    <button class="tog" data-toggle="haptics">haptics</button>
    <button class="tog" data-toggle="shadows">shadows</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
  "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
} }
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
